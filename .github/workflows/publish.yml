name: Publish to npm

# 触发方式：
#   1. 推送形如 v1.0.0 的 tag（推荐，版本号 = tag 去掉 v 前缀，需与 package.json 一致）
#   2. 手动触发：Actions 页面 → Publish to npm → Run workflow
#
# 前置条件：仓库 Settings → Secrets and variables → Actions 中添加 NPM_TOKEN
# （npmjs.com → Access Tokens → Generate New Token，选择 Publish/Automation 权限）

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: 校验版本号与 tag 一致（仅 tag 触发时）
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ package.json 版本 ($PKG_VERSION) 与 tag 版本 ($TAG_VERSION) 不一致"
            exit 1
          fi
          echo "✅ 版本一致: v$PKG_VERSION"

      - name: 检查发布内容
        run: |
          echo "== 将发布的文件 =="
          npm pack --dry-run

      - name: 发布到 npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
